<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D GI Sketch</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  canvas[hidden] { display: none; }
  #hint {
    position: fixed; left: 12px; bottom: 10px;
    font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(255,255,255,.45); pointer-events: none; user-select: none;
  }
  #cam {
    position: fixed; right: 12px; bottom: 10px;
    font: 11px/1 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(255,255,255,.6); background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.25); border-radius: 4px;
    padding: 6px 10px; cursor: pointer;
  }
  #cam.on { color: #fff; border-color: rgba(255,255,255,.7); }
  #preview {
    position: fixed; right: 12px; bottom: 44px; width: 160px;
    transform: scaleX(-1); border-radius: 4px; opacity: .85; pointer-events: none;
  }
  #preview[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="c2" hidden></canvas>
<div id="hint">click: new scene / c: camera / [ ]: edge / space: pause / s: save</div>
<video id="preview" playsinline muted hidden></video>
<button id="cam" type="button">camera</button>
<script type="module" src="main.js"></script>
</body>
</html>
